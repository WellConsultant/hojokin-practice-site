<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title desc">
  <title id="title">補助金獲得の極意</title>
  <desc id="desc">採択、交付申請、実績報告、入金の工程図</desc>
  <rect width="360" height="180" rx="12" fill="#173b59"/>
  <path d="M46 91h268" stroke="#d2b777" stroke-width="3" stroke-dasharray="6 6"/>
  <g fill="#fff" stroke="#d2b777" stroke-width="3">
    <circle cx="46" cy="91" r="18"/><circle cx="135" cy="91" r="18"/><circle cx="225" cy="91" r="18"/><circle cx="314" cy="91" r="18"/>
  </g>
  <g fill="#102a43" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="46" y="96">採択</text><text x="135" y="96">交付</text><text x="225" y="96">実績</text><text x="314" y="96">入金</text>
  </g>
  <g fill="#dbe5ec" font-family="sans-serif" font-size="10" text-anchor="middle">
